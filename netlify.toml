[build.environment]
TZ='America/Edmonton'

# Optimized heading backgrounds change infrequently; allow long-lived caching.
# Filenames are stable (not content-hashed), so avoid "immutable".
[[headers]]
  for = "/headingBackgrounds/*"
  [headers.values]
    Cache-Control = "public, max-age=604800, stale-while-revalidate=86400"
